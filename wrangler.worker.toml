# Burkett Studios marketing site — Workers Static Assets
# Deploy: npm run deploy (Trey confirm first)
# Live: burkettstudios.com + www only.
# jh.burkettstudios.com is Johnson Harvesting (different project). Do not add it here.

name = "burkett-studios-site"
compatibility_date = "2026-07-01"
workers_dev = false

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
# Missing files 404. Do not serve index.html for .css .js .svg .jpg .jpeg .png .woff2.
not_found_handling = "none"

[[routes]]
pattern = "burkettstudios.com"
custom_domain = true

[[routes]]
pattern = "www.burkettstudios.com"
custom_domain = true
